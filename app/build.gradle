plugins {
    id 'com.android.application' version '8.3.0'
}

android {
    namespace 'com.blockbot'
    compileSdk 34

    defaultConfig {
        applicationId "com.blockbot"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
