plugins {
    id 'com.android.application' version '8.3.0'
}

android {
    namespace 'com.blockbot'
    compileSdk 34

    defaultConfig {
        applicationId "com.blockbot"
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        debug {
            storeFile file('bot.keystore')
            storePassword 'blockbot123'
            keyAlias 'blockbot'
            keyPassword 'blockbot123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
