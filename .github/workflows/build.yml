name: Build BlockBot APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure persistent keystore for seamless APK updates
        run: |
          if [ ! -f app/bot.keystore ]; then
            keytool -genkey -v -keystore app/bot.keystore -alias blockbot -keyalg RSA -keysize 2048 -validity 10000 -storepass blockbot123 -keypass blockbot123 -dname "CN=BlockBot, OU=AI, O=Bot, L=City, S=State, C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add app/bot.keystore
            git commit -m "Add persistent keystore for in-place APK updates" || true
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockBot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
